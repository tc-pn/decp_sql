name: CI

on:
    push:
        branches: ["**"]
    pull_request:
        branches: ["main"]
    workflow_dispatch:

permissions:
    contents: read

jobs:
    test:
        name: Python tests
        runs-on: ubuntu-latest
        timeout-minutes: 10

        # .env
        env:
            POSTGRES_DB: decp_test
            POSTGRES_USER: test_user
            POSTGRES_PASSWORD: test_password
            POSTGRES_HOST: localhost
            POSTGRES_PORT: 5432

        # dummy database for connectivity tests
        services:
            postgres:
                image: postgres:16
                env:
                    POSTGRES_DB: decp_test
                    POSTGRES_USER: test_user
                    POSTGRES_PASSWORD: test_password
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U test_user -d decp_test"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Set up Python
              uses: actions/setup-python@v7
              with:
                  python-version: "3.12"
                  cache: pip

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  python -m pip install -e .
                  python -m pip install pytest ruff

            - name: Check code quality and fix problems
              run: ruff check . --fix

            - name: Run tests
              run: pytest -v
